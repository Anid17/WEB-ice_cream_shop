<h1 class="page-title mb-4">Admin Panel</h1>

<div class="row g-4">
  <div class="col-lg-8">
    <div class="card p-3">
      <h5>Manage products</h5>
      <div class="table-responsive">
        <table class="table align-middle mb-0">
          <thead>
            <tr><th>Name</th><th>Price</th><th>Stock</th><th>Actions</th></tr>
          </thead>
          <tbody>
            <tr>
              <td>Vanilla Bean</td><td>2.50 KM</td><td>40</td>
              <td>
                <button class="btn btn-outline-secondary btn-sm">Edit</button>
                <button class="btn btn-outline-danger btn-sm">Delete</button>
              </td>
            </tr>
            <tr>
              <td>Strawberry Sorbet</td><td>2.80 KM</td><td>25</td>
              <td>
                <button class="btn btn-outline-secondary btn-sm">Edit</button>
                <button class="btn btn-outline-danger btn-sm">Delete</button>
              </td>
            </tr>
          </tbody>
        </table>
      </div>
    </div>
  </div>
  <div class="col-lg-4">
    <div class="card p-4">
      <h5>Add product</h5>
      <form>
        <div class="mb-3">
          <label for="newProductName" class="form-label">Name</label>
          <input type="text" class="form-control" id="newProductName">
        </div>
        <div class="mb-3">
          <label for="newProductPrice" class="form-label">Price</label>
          <input type="number" class="form-control" id="newProductPrice" step="0.01">
        </div>
        <div class="mb-3">
          <label for="newProductStock" class="form-label">Stock</label>
          <input type="number" class="form-control" id="newProductStock">
        </div>
        <button type="submit" class="btn btn-specijal w-100">Add</button>
      </form>
    </div>
  </div>
</div>
