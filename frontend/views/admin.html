<h1 class="page-title mb-4">Admin Panel</h1>

<ul class="nav nav-tabs mb-3">
  <li class="nav-item"><button type="button" class="nav-link active" data-bs-toggle="tab" data-bs-target="#admin-users-tab">Users</button></li>
  <li class="nav-item"><button type="button" class="nav-link" data-bs-toggle="tab" data-bs-target="#admin-links-tab">Product categories</button></li>
  <li class="nav-item"><button type="button" class="nav-link" data-bs-toggle="tab" data-bs-target="#admin-items-tab">Order items</button></li>
</ul>

<div class="tab-content">
  <div class="tab-pane fade show active" id="admin-users-tab">
    <div class="d-flex justify-content-between align-items-center mb-2">
      <h5 class="mb-0">Users</h5>
      <button type="button" class="btn btn-specijal btn-sm" id="add-user-btn">Add user</button>
    </div>
    <div class="card p-3">
      <div class="table-responsive">
        <table class="table align-middle mb-0">
          <thead><tr><th>#</th><th>Name</th><th>Email</th><th>Role</th><th class="text-end">Actions</th></tr></thead>
          <tbody id="admin-users-list"></tbody>
        </table>
      </div>
    </div>
  </div>

  <div class="tab-pane fade" id="admin-links-tab">
    <div class="card p-3 mb-3">
      <form id="link-form" class="row g-2 align-items-end">
        <div class="col-sm-5">
          <label for="link-product" class="form-label">Product</label>
          <select class="form-select" id="link-product" required></select>
        </div>
        <div class="col-sm-5">
          <label for="link-category" class="form-label">Category</label>
          <select class="form-select" id="link-category" required></select>
        </div>
        <div class="col-sm-2">
          <button type="submit" class="btn btn-specijal w-100">Add</button>
        </div>
      </form>
    </div>
    <div class="card p-3">
      <div class="table-responsive">
        <table class="table align-middle mb-0">
          <thead><tr><th>Product</th><th>Category</th><th class="text-end">Actions</th></tr></thead>
          <tbody id="admin-links-list"></tbody>
        </table>
      </div>
    </div>
  </div>

  <div class="tab-pane fade" id="admin-items-tab">
    <div class="card p-3">
      <div class="table-responsive">
        <table class="table align-middle mb-0">
          <thead><tr><th>Order</th><th>Product</th><th>Quantity</th><th>Price</th><th>Subtotal</th><th class="text-end">Actions</th></tr></thead>
          <tbody id="admin-items-list"></tbody>
        </table>
      </div>
    </div>
  </div>
</div>

<div class="modal fade" id="user-modal" tabindex="-1">
  <div class="modal-dialog">
    <form class="modal-content" id="user-form">
      <div class="modal-header">
        <h5 class="modal-title" id="user-modal-title">Add user</h5>
        <button type="button" class="btn-close" data-bs-dismiss="modal"></button>
      </div>
      <div class="modal-body">
        <input type="hidden" id="user-id">
        <div class="mb-3">
          <label for="user-name" class="form-label">Name</label>
          <input type="text" class="form-control" id="user-name" required>
        </div>
        <div class="mb-3">
          <label for="user-email" class="form-label">Email</label>
          <input type="email" class="form-control" id="user-email" required>
        </div>
        <div class="mb-3">
          <label for="user-role" class="form-label">Role</label>
          <select class="form-select" id="user-role">
            <option value="customer">customer</option>
            <option value="admin">admin</option>
          </select>
        </div>
        <div class="mb-3">
          <label for="user-password" class="form-label">Password (when editing, leave empty to keep it)</label>
          <input type="password" class="form-control" id="user-password">
        </div>
      </div>
      <div class="modal-footer">
        <button type="button" class="btn btn-outline-secondary" data-bs-dismiss="modal">Cancel</button>
        <button type="submit" class="btn btn-specijal">Save</button>
      </div>
    </form>
  </div>
</div>

<script>AdminService.init();</script>
