<h1 class="page-title mb-4">Reviews</h1>

<div class="row g-4">
  <div class="col-lg-7" id="reviews-list"></div>
  <div class="col-lg-5">
    <div class="card p-4">
      <h5 id="review-form-title">Write a review</h5>
      <form id="review-form">
        <input type="hidden" id="review-id">
        <div class="mb-3">
          <label for="review-product" class="form-label">Product</label>
          <select class="form-select" id="review-product" required></select>
        </div>
        <div class="mb-3">
          <label for="review-rating" class="form-label">Rating (1-5)</label>
          <input type="number" class="form-control" id="review-rating" min="1" max="5" value="5" required>
        </div>
        <div class="mb-3">
          <label for="review-comment" class="form-label">Comment</label>
          <textarea class="form-control" id="review-comment" rows="3" maxlength="500"></textarea>
        </div>
        <button type="submit" class="btn btn-specijal w-100" id="review-submit">Submit review</button>
        <button type="button" class="btn btn-outline-secondary w-100 mt-2 d-none" id="review-cancel">Cancel editing</button>
      </form>
    </div>
  </div>
</div>

<script>ReviewService.init();</script>
