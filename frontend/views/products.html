<div class="d-flex justify-content-between align-items-center mb-4">
  <h1 class="page-title mb-0">Products</h1>
  <button type="button" class="btn btn-specijal admin-only d-none" id="add-product-btn">Add product</button>
</div>

<div class="row g-4" id="products-list"></div>

<div class="modal fade" id="product-modal" tabindex="-1">
  <div class="modal-dialog">
    <form class="modal-content" id="product-form">
      <div class="modal-header">
        <h5 class="modal-title" id="product-modal-title">Add product</h5>
        <button type="button" class="btn-close" data-bs-dismiss="modal"></button>
      </div>
      <div class="modal-body">
        <input type="hidden" id="product-id">
        <div class="mb-3">
          <label for="product-name" class="form-label">Name</label>
          <input type="text" class="form-control" id="product-name" required>
        </div>
        <div class="mb-3">
          <label for="product-description" class="form-label">Description</label>
          <textarea class="form-control" id="product-description" rows="2"></textarea>
        </div>
        <div class="row">
          <div class="col-6 mb-3">
            <label for="product-price" class="form-label">Price (KM)</label>
            <input type="number" class="form-control" id="product-price" step="0.01" min="0.01" required>
          </div>
          <div class="col-6 mb-3">
            <label for="product-stock" class="form-label">Stock</label>
            <input type="number" class="form-control" id="product-stock" step="1" min="0" required>
          </div>
        </div>
      </div>
      <div class="modal-footer">
        <button type="button" class="btn btn-outline-secondary" data-bs-dismiss="modal">Cancel</button>
        <button type="submit" class="btn btn-specijal">Save</button>
      </div>
    </form>
  </div>
</div>

<script>ProductService.init();</script>
