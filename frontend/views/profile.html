<h1 class="page-title mb-4">My Profile</h1>

<div class="row justify-content-center">
  <div class="col-md-8 col-lg-6">
    <div class="card p-4">
      <form id="profile-form">
        <div class="mb-3">
          <label for="profile-name" class="form-label">Name</label>
          <input type="text" class="form-control" id="profile-name" required>
        </div>
        <div class="mb-3">
          <label for="profile-email" class="form-label">Email</label>
          <input type="email" class="form-control" id="profile-email" required>
        </div>
        <div class="mb-3">
          <label for="profile-password" class="form-label">New password (optional)</label>
          <input type="password" class="form-control" id="profile-password">
        </div>
        <div class="mb-3">
          <label for="profile-role" class="form-label">Role</label>
          <input type="text" class="form-control" id="profile-role" disabled>
        </div>
        <button type="submit" class="btn btn-specijal">Save changes</button>
      </form>
    </div>
  </div>
</div>

<script>ProfileService.init();</script>
