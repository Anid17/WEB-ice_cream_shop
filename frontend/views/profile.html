<h1 class="page-title mb-4">My Profile</h1>

<div class="row justify-content-center">
  <div class="col-md-8 col-lg-6">
    <div class="card p-4">
      <form>
        <div class="mb-3">
          <label for="profName" class="form-label">Name</label>
          <input type="text" class="form-control" id="profName" value="Anid Ali">
        </div>
        <div class="mb-3">
          <label for="profEmail" class="form-label">Email</label>
          <input type="email" class="form-control" id="profEmail" value="anid@example.com">
        </div>
        <div class="mb-3">
          <label for="profRole" class="form-label">Role</label>
          <input type="text" class="form-control" id="profRole" value="customer" disabled>
        </div>
        <button type="submit" class="btn btn-specijal">Save changes</button>
      </form>
    </div>
  </div>
</div>
