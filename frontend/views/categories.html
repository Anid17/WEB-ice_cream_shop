<div class="d-flex justify-content-between align-items-center mb-4">
  <h1 class="page-title mb-0">Categories</h1>
  <button type="button" class="btn btn-specijal admin-only d-none" id="add-category-btn">Add category</button>
</div>

<div class="card p-3">
  <div class="table-responsive">
    <table class="table align-middle mb-0">
      <thead>
        <tr><th>#</th><th>Name</th><th class="admin-only d-none text-end">Actions</th></tr>
      </thead>
      <tbody id="categories-list"></tbody>
    </table>
  </div>
</div>

<div class="modal fade" id="category-modal" tabindex="-1">
  <div class="modal-dialog">
    <form class="modal-content" id="category-form">
      <div class="modal-header">
        <h5 class="modal-title" id="category-modal-title">Add category</h5>
        <button type="button" class="btn-close" data-bs-dismiss="modal"></button>
      </div>
      <div class="modal-body">
        <input type="hidden" id="category-id">
        <label for="category-name" class="form-label">Name</label>
        <input type="text" class="form-control" id="category-name" required>
      </div>
      <div class="modal-footer">
        <button type="button" class="btn btn-outline-secondary" data-bs-dismiss="modal">Cancel</button>
        <button type="submit" class="btn btn-specijal">Save</button>
      </div>
    </form>
  </div>
</div>

<script>CategoryService.init();</script>
