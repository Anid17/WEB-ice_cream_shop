<div class="row justify-content-center">
  <div class="col-md-6 col-lg-5">
    <div class="card p-4">
      <h2 class="page-title text-center mb-4">Create your account</h2>
      <form>
        <div class="mb-3">
          <label for="regName" class="form-label">Name</label>
          <input type="text" class="form-control" id="regName" required>
        </div>
        <div class="mb-3">
          <label for="regEmail" class="form-label">Email</label>
          <input type="email" class="form-control" id="regEmail" required>
        </div>
        <div class="mb-3">
          <label for="regPassword" class="form-label">Password</label>
          <input type="password" class="form-control" id="regPassword" required>
        </div>
        <button type="submit" class="btn btn-specijal w-100">Register</button>
      </form>
      <p class="text-center mt-3 mb-0">Already registered? <a href="#login">Log in</a></p>
    </div>
  </div>
</div>
